<rect x="0.5" y="0.5" width="999" height="582" rx="9" fill="#EDEFF1" stroke="#D2D6DB"/>
<line x1="0" y1="42" x2="1000" y2="42" stroke="#D2D6DB" stroke-width="1"/>
<rect x="28" y="18" width="7" height="7" fill="#2E7D52"/>
<text x="46" y="25" class="m" font-size="11" fill="#5A6169">umer@bench — sh</text>
<text x="972" y="25" class="m" font-size="11" fill="#767D85" text-anchor="end">Islamabad, PKT (UTC+5)</text>
<text x="28" y="70" class="m" font-size="13" fill="#E04A0F">$</text>
<text x="48" y="70" class="m" font-size="13" fill="#0B0D10" font-weight="600">umer --help</text>
<text x="48" y="91.5" class="m" font-size="13" fill="#5A6169">umer — hand me a system that is too slow, too unreliable,</text>
<text x="48" y="113" class="m" font-size="13" fill="#5A6169">       or not built yet.</text>
<text x="28" y="156" class="m" font-size="12.5" fill="#767D85">usage: umer &lt;problem&gt; [--constraints] [--deadline]</text>
<text x="28" y="199" class="m" font-size="12.5" fill="#767D85">problems</text>
<text x="48" y="220.5" class="m" font-size="13" fill="#E04A0F" font-weight="600">gpu-kernel</text>
<text x="152" y="220.5" class="m" font-size="13" fill="#5A6169">my GPU kernel is slower than it should be</text>
<text x="48" y="242" class="m" font-size="13" fill="#E04A0F" font-weight="600">parallelise</text>
<text x="152" y="242" class="m" font-size="13" fill="#5A6169">this job takes hours and I need it to take minutes</text>
<text x="48" y="263.5" class="m" font-size="13" fill="#0E8AA8" font-weight="600">quantum-sim</text>
<text x="152" y="263.5" class="m" font-size="13" fill="#5A6169">I need to simulate or compare quantum circuits</text>
<text x="48" y="285" class="m" font-size="13" fill="#6D4AC4" font-weight="600">verify-ai</text>
<text x="152" y="285" class="m" font-size="13" fill="#5A6169">my AI system is confidently wrong</text>
<text x="48" y="306.5" class="m" font-size="13" fill="#2563EB" font-weight="600">build-it</text>
<text x="152" y="306.5" class="m" font-size="13" fill="#5A6169">I need the whole thing built, not just the fast part</text>
<text x="48" y="328" class="m" font-size="13" fill="#2E7D52" font-weight="600">review</text>
<text x="152" y="328" class="m" font-size="13" fill="#5A6169">check our architecture before we commit to it</text>
<text x="28" y="371" class="m" font-size="13" fill="#E04A0F">$</text>
<text x="48" y="371" class="m" font-size="13" fill="#0B0D10" font-weight="600">umer gpu-kernel --what-i-get</text>
<text x="48" y="392.5" class="m" font-size="13" fill="#E04A0F">1</text>
<text x="72" y="392.5" class="m" font-size="13" fill="#5A6169">an Nsight profile with the bottleneck named, not guessed</text>
<text x="48" y="414" class="m" font-size="13" fill="#E04A0F">2</text>
<text x="72" y="414" class="m" font-size="13" fill="#5A6169">an optimised kernel, with before and after timings</text>
<text x="48" y="435.5" class="m" font-size="13" fill="#E04A0F">3</text>
<text x="72" y="435.5" class="m" font-size="13" fill="#5A6169">what to do next — and what is not worth doing</text>
<text x="28" y="478.5" class="m" font-size="13" fill="#E04A0F">$</text>
<text x="48" y="478.5" class="m" font-size="13" fill="#0B0D10" font-weight="600">umer --status</text>
<text x="48" y="500" class="m" font-size="13" fill="#2E7D52" font-weight="600">available</text>
<text x="152" y="500" class="m" font-size="13" fill="#5A6169">internships · contract · research collaboration</text>
<text x="48" y="521.5" class="m" font-size="13" fill="#5A6169" font-weight="600">timezone</text>
<text x="152" y="521.5" class="m" font-size="13" fill="#5A6169">Asia/Karachi (UTC+5) — replies inside 24h</text>
<text x="48" y="543" class="m" font-size="13" fill="#E04A0F" font-weight="600">contact</text>
<text x="152" y="543" class="m" font-size="13" fill="#5A6169">umerfarooqcs0891@gmail.com</text>
