<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="402" viewBox="0 0 1000 402" role="img">
<style>
  .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

</style>
<rect x="0.5" y="0.5" width="999" height="401" rx="9" fill="#EDEFF1" stroke="#D2D6DB"/>
<text x="28" y="44" class="s" font-size="19" font-weight="600" fill="#0B0D10">Selected work</text>
<text x="28" y="67" class="m" font-size="11.5" fill="#767D85">6 of 30 — each carries the number it was measured by</text>
<line x1="676" y1="88" x2="676" y2="386" stroke="#D2D6DB" stroke-width="1"/>
<rect x="28" y="100" width="3" height="28" rx="1.5" fill="#0E8AA8"/>
<text x="44" y="114" class="s" font-size="14.5" font-weight="600" fill="#0B0D10">QCanvas</text>
<text x="44" y="130" class="m" font-size="10.5" fill="#767D85">One interface across Cirq, Qiskit and PennyLane, Kubernetes scheduling the jobs.</text>
<text x="700" y="116" class="m" font-size="19" font-weight="600" fill="#0E8AA8">3rd</text>
<text x="700" y="131" class="m" font-size="10" fill="#767D85">Huawei ICT national finals</text>
<line x1="28" y1="138" x2="972" y2="138" stroke="#E2E5E9" stroke-width="1"/>
<rect x="28" y="148" width="3" height="28" rx="1.5" fill="#6D4AC4"/>
<text x="44" y="162" class="s" font-size="14.5" font-weight="600" fill="#0B0D10">Cirq-RAG Code Assistant</text>
<text x="44" y="178" class="m" font-size="10.5" fill="#767D85">Prompts to executable circuits, through a loop that runs the code and repairs it.</text>
<text x="700" y="164" class="m" font-size="19" font-weight="600" fill="#6D4AC4">92%</text>
<text x="700" y="179" class="m" font-size="10" fill="#767D85">vs 52% single-agent baseline</text>
<line x1="28" y1="186" x2="972" y2="186" stroke="#E2E5E9" stroke-width="1"/>
<rect x="28" y="196" width="3" height="28" rx="1.5" fill="#E04A0F"/>
<text x="44" y="210" class="s" font-size="14.5" font-weight="600" fill="#0B0D10">MNIST on GPU</text>
<text x="44" y="226" class="m" font-size="10.5" fill="#767D85">Five versions, serial CPU through Tensor Cores, each one profiled not guessed.</text>
<text x="700" y="212" class="m" font-size="19" font-weight="600" fill="#E04A0F">6.0×</text>
<text x="700" y="227" class="m" font-size="10" fill="#767D85">inference, accuracy held at 99%+</text>
<line x1="28" y1="234" x2="972" y2="234" stroke="#E2E5E9" stroke-width="1"/>
<rect x="28" y="244" width="3" height="28" rx="1.5" fill="#E04A0F"/>
<text x="44" y="258" class="s" font-size="14.5" font-weight="600" fill="#0B0D10">Q-Tensor</text>
<text x="44" y="274" class="m" font-size="10.5" fill="#767D85">Tensor networks split across MPI ranks with METIS, contracted on the GPU.</text>
<text x="700" y="260" class="m" font-size="19" font-weight="600" fill="#E04A0F">20+</text>
<text x="700" y="275" class="m" font-size="10" fill="#767D85">qubit circuits simulated</text>
<line x1="28" y1="282" x2="972" y2="282" stroke="#E2E5E9" stroke-width="1"/>
<rect x="28" y="292" width="3" height="28" rx="1.5" fill="#E04A0F"/>
<text x="44" y="306" class="s" font-size="14.5" font-weight="600" fill="#0B0D10">Canny edge detector</text>
<text x="44" y="322" class="m" font-size="10.5" fill="#767D85">The whole pipeline in CUDA — tiled shared memory, coalesced access.</text>
<text x="700" y="308" class="m" font-size="19" font-weight="600" fill="#E04A0F">3.5×</text>
<text x="700" y="323" class="m" font-size="10" fill="#767D85">over sequential CPU</text>
<line x1="28" y1="330" x2="972" y2="330" stroke="#E2E5E9" stroke-width="1"/>
<rect x="28" y="340" width="3" height="28" rx="1.5" fill="#2E7D52"/>
<text x="44" y="354" class="s" font-size="14.5" font-weight="600" fill="#0B0D10">Ring DHT with IPFS</text>
<text x="44" y="370" class="m" font-size="10.5" fill="#767D85">Chord ring over 160-bit SHA-1, replicated so lookups survive nodes leaving.</text>
<text x="700" y="356" class="m" font-size="19" font-weight="600" fill="#2E7D52">O(log N)</text>
<text x="700" y="371" class="m" font-size="10" fill="#767D85">finger-table routing</text>
</svg>
